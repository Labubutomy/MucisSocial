[tool.poetry]
name = "route-session-service"
version = "0.1.0"
description = "Route Session Service for Music Social - manages route playback sessions"
authors = ["<iizhukv@icloud.com>"]
readme = "README.md"
packages = [
    { include = "api" },
    { include = "core" },
    { include = "models" },
    { include = "schemas" },
    { include = "services" },
    { include = "main.py" }
]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
asyncpg = "^0.29.0"
redis = "^5.0.1"
aiokafka = "^0.11.0"
pydantic = "^2.5.0"
pydantic-settings = "^2.3.0"
httpx = "^0.27.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.23.7"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

