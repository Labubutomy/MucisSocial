[tool.poetry]
name = "music-requests-service"
version = "0.1.0"
description = "Music requests service for Music Social - allows artists to receive track requests via QR codes"
authors = ["Music Social"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = "^0.32.0"
sqlalchemy = "^2.0.36"
asyncpg = "^0.30.0"
alembic = "^1.13.3"
psycopg2-binary = "^2.9.10"
pydantic = "^2.9.0"
pydantic-settings = "^2.6.1"
python-dotenv = "^1.0.1"
PyJWT = "^2.8.0"
httpx = "^0.27.0"
qrcode = "^7.4.2"
pillow = "^10.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
