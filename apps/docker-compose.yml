services:
  web-client:
    build:
      context: ./web
    ports:
      - "3000:80"
    networks:  
      - music-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  player:
    build:
      context: ./player
    networks:
      - music-network
    restart: unless-stopped
